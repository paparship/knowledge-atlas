<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP 连接与传输对照</title>
<style>
  :root { font: 14px/1.4 "Microsoft YaHei UI", system-ui, sans-serif; color: #1d2739; background: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px; }
  button, select { font: inherit; color: inherit; background: #fff; border: 1px solid #c7d0df; border-radius: 6px; padding: 4px 9px; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid #245bc2; outline-offset: 2px; }
  #play { color: white; background: #245bc2; border-color: #245bc2; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .stage { margin: 8px 0; min-height: 2.8em; }
  #phase { margin-right: 7px; color: #52627b; font-variant-numeric: tabular-nums; }
  #cue { display: block; color: #475774; font-size: .9em; }
  #boards { max-width: 42rem; }
  .board { padding: 8px 9px; border: 1px solid #d5deeb; border-radius: 8px; min-width: 0; }
  .board { border-color: #7599df; background: #f5f8ff; }
  h2 { font-size: 1em; margin: 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  h2 span { color: #52627b; font-size: .85em; font-weight: 400; }
  .ends, .out { display: flex; justify-content: space-between; align-items: center; gap: 5px; color: #52627b; font-size: .84em; }
  .ends { margin: 8px 0 3px; font-size: .9em; font-weight: 600; color: #273850; }
  .lane { display: grid; grid-template-columns: 4.8em minmax(0, 1fr); align-items: center; gap: 4px; height: 34px; }
  .lane[hidden] { display: none; }
  .lane-label { font-size: .82em; color: #475774; }
  .board.request .track::after { content: "‹"; right: auto; left: -9px; }
  .packet, .delivered { padding-inline: 4px; white-space: nowrap; }
  .track { position: relative; height: 20px; margin: 0 38px; }
  .track::before { content: ""; position: absolute; inset: 9px -8px auto; border-top: 2px solid #9bacc5; }
  .track::after { content: "›"; position: absolute; right: -9px; top: -5px; color: #667996; font-size: 20px; }
  .lane.quic .track::before { border-color: #6e59ad; }
  .lane.off .track::before { border-top-style: dashed; opacity: .5; }
  .lane.off .track::after { opacity: .5; }
  .packet, .delivered { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 4px; color: #fff; font: 600 12px/1 system-ui, sans-serif; background: #245bc2; }
  .packet { position: absolute; top: 0; z-index: 1; transform: translateX(-50%); transition: left 650ms ease-in-out; }
  .packet.b, .delivered.b { background: #6541a6; }
  .packet.wait { background: #fff; color: #684014; border: 1px solid #ae7a32; }
  .packet.lost { background: #a72940; }
  .packet[hidden] { display: none; }
  .out { min-height: 28px; margin-top: 6px; padding: 4px 7px; border: 1px solid #d5deeb; border-radius: 5px; background: #fff; }
  .received { display: flex; align-items: center; gap: 4px; color: #273850; min-width: 0; }
  .received .delivered { height: 17px; min-width: 17px; }
  .delivered { animation: received 220ms ease-out; }
  @keyframes received { from { transform: scale(.75); opacity: .5; } }
  #boards.resetting .packet { transition: none; }
  @media (prefers-reduced-motion: reduce) { .packet, .delivered { transition: none; animation: none; } }
</style>

<p id="context" style="margin:0 0 10px;padding:8px;background:#f2f5fa;border-radius:6px"></p>
<div class="controls">
  <select id="protocol" aria-label="选择协议">
    <option value="0">HTTP/1.0</option>
    <option value="1">HTTP/1.1</option>
    <option value="2" selected>HTTP/2</option>
    <option value="3">HTTP/3</option>
  </select>
  <select id="scenario" aria-label="演示场景">
    <option value="reuse">正文准备慢，封面准备快</option>
    <option value="loss">正文响应丢包</option>
    <option value="migration">Wi-Fi 切到 4G</option>
  </select>
  <button type="button" id="play">播放</button>
  <button type="button" id="back">上一步</button>
  <button type="button" id="next">下一步</button>
</div>
<p class="stage" aria-live="polite"><span id="phase"></span><strong id="stage"></strong><span id="cue"></span></p>
<div id="boards"></div>

<script>
  const protocols = ['HTTP/1.0', 'HTTP/1.1', 'HTTP/2', 'HTTP/3'];
  const layouts = [
    ['两条 TCP 连接', ['TCP ①', 'TCP ②']],
    ['单连接流水线', ['TCP ①']],
    ['一条 TCP，两个流', ['TCP ①']],
    ['一条 QUIC，两个流', ['QUIC · A', 'QUIC · B']],
  ];
  const [a, b] = ['A', 'B'];
  const scenarios = {
    reuse: [
      ['请求 A、B，服务端先完成 B', '观察 B 何时能交给浏览器。',
        [[0, 15], [0, 0], [0, 15], [0, 15]], ['', '', '', '']],
      ['B 到达', 'HTTP/1.1 流水线上的 B 留在服务端，等待 A 的响应先发完。',
        [[0, 100], [0, 0], [0, 100], [0, 100]], [b, '', b, b]],
      ['A 到达', 'HTTP/1.1 先交付 A，随后才能发送 B。',
        [[100, 100], [100, 48], [100, 100], [100, 100]], ['BA', a, 'BA', 'BA']],
      ['两个响应均已交付', 'HTTP/1.0 的 A、B 各用一条连接，HTTP/2 和 HTTP/3 在同一连接内用两个流。',
        [[100, 100], [100, 100], [100, 100], [100, 100]], ['BA', 'AB', 'BA', 'BA']],
    ],
    loss: [
      ['服务端开始发送数据', '设 B 的数据排在丢失的 A 字节之后，比较 TCP 和 QUIC 如何交付。',
        [[22, 0], [22, 0], [22, 0], [22, 0]], ['', '', '', '']],
      ['A 丢包，B 的数据已到达客户端传输层', 'TCP 缺口挡住同连接上的 B。QUIC 的 B 流可以单独交付。',
        [[45, 100], [45, 100], [45, 100], [45, 100]], [b, '等待 TCP 补齐 A', '等待 TCP 补齐 A', b]],
      ['A 的缺失数据补齐', 'TCP 现在可以按序交付，QUIC 的 B 此前已经交付。',
        [[100, 100], [100, 100], [100, 100], [100, 100]], ['BA', 'AB', 'AB', 'BA']],
    ],
    migration: [
      ['视频通过 Wi-Fi 传输', '① 和 ② 标记连接，连接 ID 用于在新地址上识别已有 QUIC 连接。',
        [[55], [55], [55], [55]], ['播放中', '播放中', '播放中', '播放中']],
      ['切到 4G，原路径失效', 'TCP 需要建立新连接。允许迁移时，QUIC 在新路径上验证可达性。',
        [[0], [0], [0], [53]], ['重新连接', '重新连接', '重新连接', '验证新路径']],
      ['4G 路径可用', 'HTTP/1.0、1.1 和 2 使用 TCP ② 重新请求。HTTP/3 沿用 QUIC ①，原视频流继续。',
        [[100], [100], [100], [100]], ['新请求', '新请求', '新请求', '原流继续']],
    ],
  };

  const scene = document.querySelector('#scenario');
  const protocolChoice = document.querySelector('#protocol');
  const play = document.querySelector('#play');
  const back = document.querySelector('#back');
  const next = document.querySelector('#next');
  const phase = document.querySelector('#phase');
  const stage = document.querySelector('#stage');
  const cue = document.querySelector('#cue');
  const boards = document.querySelector('#boards');

  const views = protocols.map((protocol, index) => {
    const board = document.createElement('section');
    board.className = 'board';
    board.innerHTML = '<h2></h2><p class="diagram-note" style="margin:4px 0;font-size:.85em;color:#52627b"></p><div class="ends"><span>服务端</span><span class="destination"></span></div><div class="lanes"></div><div class="out"><span>浏览器应用层已收到</span><span class="received"></span></div>';
    const heading = board.querySelector('h2');
    heading.textContent = protocol;
    const type = document.createElement('span');
    heading.append(type);
    const lanes = Array.from({ length: 2 }, () => {
      const lane = document.createElement('div');
      lane.className = 'lane' + (index === 3 ? ' quic' : '');
      lane.innerHTML = '<span class="lane-label"></span><div class="track"></div>';
      board.querySelector('.lanes').append(lane);
      return { lane, label: lane.firstElementChild, track: lane.lastElementChild };
    });
    const packets = [a, b].map(name => {
      const packet = document.createElement('span');
      packet.className = 'packet ' + name.toLowerCase();
      packet.textContent = name;
      packet.setAttribute('aria-hidden', 'true');
      return packet;
    });
    boards.append(board);
    return { board, type, lanes, packets, destination: board.querySelector('.destination'), received: board.querySelector('.received') };
  });


  const captions = {
    reuse: [
      [
        ['A、B 使用两条 TCP 连接', '服务端先完成 B，通过 B 自己的连接发送。'],
        ['B 已交给浏览器', 'A 尚未完成，B 的独立连接已经完成传输。'],
        ['A 也交给浏览器', '两个响应分别通过各自的 TCP 连接返回。'],
        ['两个响应均已交付', '本例为每个请求使用一条 TCP 连接。'],
      ],
      [
        ['同一连接先请求 A，再请求 B', '本例使用 HTTP/1.1 流水线，响应必须按请求顺序返回。'],
        ['B 已处理完，但还不能发送', '服务端必须先发完 A 的响应，才能发送 B 的响应。'],
        ['A 已交付，开始发送 B', '同一连接上的响应顺序为 A、B。'],
        ['A、B 已依次交付', '两次请求复用了同一条 TCP 连接。'],
      ],
      [
        ['A、B 使用同一连接中的两个流', 'HTTP/2 可以交错发送不同流的数据。'],
        ['B 先交给浏览器', 'A 尚未处理完，不妨碍服务端发送 B 的响应。'],
        ['A 也交给浏览器', '浏览器通过流标识区分 A、B 的响应。'],
        ['两个响应均已交付', '两次请求通过一条 TCP 连接中的两个 HTTP/2 流完成。'],
      ],
      [
        ['A、B 使用同一 QUIC 连接中的两个流', '两个流的数据可以交错发送。'],
        ['B 先交给浏览器', 'A 尚未处理完，B 流可以继续传输和交付。'],
        ['A 也交给浏览器', '两个响应通过各自的 QUIC 流交付。'],
        ['两个响应均已交付', '图中的两条轨道表示同一 QUIC 连接内的两个流。'],
      ],
    ],
    loss: [
      [
        ['A、B 分别通过两条 TCP 连接发送', '本例中 A 的连接将发生丢包。'],
        ['A 丢包，B 已交付', 'B 使用另一条 TCP 连接，可以独立完成交付。'],
        ['A 重传成功并交付', 'A 的连接补齐缺失字节，B 此前已经完成。'],
      ],
      [
        ['A、B 的响应依次写入一条 TCP 连接', '本例中 A 的部分字节将丢失。'],
        ['A 丢包，B 等待交付', 'B 的字节已到客户端，但 TCP 要先补齐前面的 A 字节。'],
        ['A 的缺失字节补齐', 'TCP 按序交付字节，浏览器依次取得 A、B 的响应。'],
      ],
      [
        ['两个 HTTP/2 流共用一条 TCP 连接', '本例中 B 的字节排在将丢失的 A 字节之后。'],
        ['A 丢包，B 也被阻塞', 'B 的数据已到客户端 TCP 层，但 TCP 要先补齐字节缺口才能向上交付。'],
        ['重传补齐 TCP 字节缺口', 'TCP 恢复按序交付，HTTP/2 才能继续处理后面的 B 数据。'],
      ],
      [
        ['A、B 通过两个 QUIC 流发送', 'QUIC 分别维护各流的数据交付顺序。'],
        ['A 丢包，B 仍可交付', 'B 流所需的数据已完整到达，可以先交给浏览器。'],
        ['A 的缺失数据补齐', 'A 流恢复交付，B 流此前已经交付。'],
      ],
    ],
    migration: [
      ...Array.from({ length: 3 }, () => [
        ['通过 Wi-Fi 上的 TCP 连接接收视频', '① 表示当前使用的 TCP 连接。'],
        ['切到 4G，原 TCP 路径失效', '客户端地址变化，需要建立新的 TCP 连接。'],
        ['通过新 TCP 连接重新请求视频数据', '② 表示新连接，应用需要重新发起请求以继续播放。'],
      ]),
      [
        ['通过 Wi-Fi 上的 QUIC 连接接收视频', '① 表示当前使用的 QUIC 连接。'],
        ['切到 4G，开始迁移连接', 'QUIC 自己维护连接 ID，地址变化后仍用它识别原连接，并验证新路径。'],
        ['原 QUIC 连接通过 4G 继续传输', '本例允许连接迁移，两条网络路径对应同一条连接①。'],
      ],
    ],
  };

  let step = 0;
  let timer = null;

  function render() {
    const frames = scenarios[scene.value];
    const responseStep = Math.max(0, step - 3);
    const requestPhase = step < 3;
    const [, , positions, output] = frames[responseStep];
    const migration = scene.value === 'migration';
    phase.textContent = (step + 1) + ' / ' + (frames.length + 3);


    const selected = Number(protocolChoice.value);
    const names = migration ? ['视频', ''] : ['正文', '封面'];
    const describe = text => text.replace(/A/g, names[0]).replace(/B/g, names[1]);
    const requestCaptions = [
      ['浏览器准备发出请求', migration
        ? '用户点击播放，浏览器准备请求视频数据。'
        : '文章页面已加载，浏览器接下来分别请求正文内容和封面图片。'],
      ['请求从浏览器发往服务端', migration
        ? 'GET /video：请求视频数据。'
        : 'GET /article：请求正文；GET /cover.jpg：请求封面图片。'],
      ['服务端收到请求，准备响应', migration
        ? '服务端读取视频，准备返回视频数据。'
        : '服务端查询正文、读取封面图片，然后按当前协议发送响应。'],
    ];
    const [heading, detail] = requestPhase
      ? requestCaptions[step]
      : captions[scene.value][selected][responseStep];
    stage.textContent = describe(heading);
    cue.textContent = describe(detail);
    document.querySelector('#context').textContent = migration
      ? '你正在用手机看视频：浏览器请求视频，服务器持续返回视频数据。接下来模拟手机从 Wi-Fi 切到 4G，观察原连接能否继续使用。'
      : scene.value === 'reuse'
        ? '你打开一篇文章：页面框架已加载，接下来分别请求 A（文章正文）和 B（封面图片）。正文需要查询数据库，封面图片已经可以读取，所以封面先准备好。观察它能不能先返回。'
        : '你打开一篇文章：浏览器分别请求 A（正文）和 B（封面），服务器已准备好两份响应。传输途中，装有部分正文数据的包丢失，封面数据随后到达客户端。观察封面能不能先交给浏览器。';
    views.forEach(({ board, type, lanes, packets, destination, received }, index) => {
      board.hidden = index !== selected;
      if (board.hidden) return;
      const quic = index === 3;
      board.classList.toggle('request', requestPhase);
      destination.textContent = requestPhase ? '浏览器（发请求）' : quic ? '客户端 QUIC 层' : '客户端 TCP 层';
      board.querySelector('.diagram-note').textContent = migration
        ? '左侧是服务端，右侧是你的设备。两行代表两条网络路径。'
        : '左侧是服务端，右侧是你的设备。A 表示正文，B 表示封面；当前色块表示' + (requestPhase ? '请求。' : '响应数据。') + '';
      type.textContent = migration ? (quic ? '连接迁移' : 'TCP 重连') : layouts[index][0];
      const labels = migration
        ? (quic ? ['Wi-Fi · ①', '4G · ①'] : ['Wi-Fi · ①', '4G · ②'])
        : layouts[index][1];
      lanes.forEach(({ lane, label }, laneIndex) => {
        lane.hidden = laneIndex >= labels.length;
        lane.classList.toggle('off', migration && (responseStep === 0 ? laneIndex === 1 : laneIndex === 0));
        label.textContent = labels[laneIndex] || '';
      });
      packets.forEach((packet, packetIndex) => {
        const position = requestPhase
          ? (migration && packetIndex === 1 ? undefined : [100, 45, 0][step])
          : positions[index][packetIndex];
        const laneIndex = migration ? Number(responseStep > 0) : labels.length === 2 ? packetIndex : 0;
        const track = lanes[laneIndex].track;
        if (packet.parentElement !== track) track.append(packet);
        packet.hidden = position === undefined;
        const lost = scene.value === 'loss' && !requestPhase && responseStep === 1 && packetIndex === 0;
        const waiting = (scene.value === 'loss' && !requestPhase && responseStep === 1 && packetIndex === 1 && (index === 1 || index === 2))
          || (scene.value === 'reuse' && !requestPhase && responseStep === 1 && packetIndex === 1 && index === 1);
        packet.classList.toggle('lost', lost);
        packet.classList.toggle('wait', waiting);
        const resource = names[packetIndex];
        packet.textContent = lost ? '×' : packetIndex === 0 ? 'A' : 'B';
        packet.title = requestPhase ? '浏览器请求' + resource : resource + '响应的数据传输示意';
        // Keep a fixed marker offset, independent of other data's arrival.
        const offset = !migration && labels.length === 1 && packetIndex === 1 ? 22 : 0;
        packet.style.left = 'calc(' + (position ?? 0) + '% + ' + offset + 'px)';
      });
      const result = requestPhase ? '等待响应' : output[index];
      if (received.dataset.result !== result) {
        received.dataset.result = result;
        if (/^[AB]+$/.test(result)) {
          received.replaceChildren(...Array.from(result, name => {
            const mark = document.createElement('span');
            mark.className = 'delivered ' + name.toLowerCase();
            mark.textContent = name;
            return mark;
          }));
        } else {
          received.textContent = describe(result || '等待响应');
        }
      }
    });
    back.disabled = step === 0;
    next.disabled = step === frames.length + 2;
    play.textContent = timer !== null ? '暂停' : next.disabled ? '重播' : '播放';
  }

  function pause() {
    clearInterval(timer);
    timer = null;
  }
  function move(delta) {
    const previousStep = step;
    step += delta;
    if (step === scenarios[scene.value].length + 2) pause();
    const startResponse = previousStep === 2 && step === 3;
    if (delta < 0 || startResponse) boards.classList.add('resetting');
    render();
    void boards.offsetWidth;
    boards.classList.remove('resetting');
  }

  play.onclick = () => {
    if (timer !== null) pause();
    else {
      if (next.disabled) step = 0;
      timer = setInterval(() => move(1), 1800);
    }
    render();
  };
  back.onclick = () => { pause(); move(-1); };
  next.onclick = () => { pause(); move(1); };
  function resetView() {
    pause();
    step = 0;
    boards.classList.add('resetting');
    render();
    // Apply the starting positions before re-enabling movement.
    void boards.offsetWidth;
    boards.classList.remove('resetting');
  }

  scene.onchange = resetView;
  protocolChoice.onchange = resetView;
  resetView();
</script>
</html>
